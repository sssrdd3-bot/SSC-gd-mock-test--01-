<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polai Academy - SSC-GD Mock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { height: 100vh; transition: background 0.5s ease; overflow: hidden; }
        
        .screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed; }
        #welcome-screen { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; text-align: center; }
        
        /* Glassmorphism Card */
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 20px; width: 92%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        /* Timer & Header */
        .top-bar { width: 92%; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .timer-badge { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; }
        
        /* Palette Grid for Mobile */
        .palette-mobile { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 92%; margin: 10px 0; max-height: 80px; overflow-y: auto; }
        .p-dot { height: 28px; width: 28px; border-radius: 5px; border: 1px solid #ccc; background: white; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .p-dot.done { background: #27ae60; color: white; border: none; }
        .p-dot.active { border: 2px solid #000; transform: scale(1.1); }

        /* Question Content */
        .q-area { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; margin-bottom: 70px; }
        .q-tag { font-size: 0.8rem; background: #2c3e50; color: white; padding: 2px 10px; border-radius: 4px; align-self: flex-start; margin-bottom: 10px; }
        .q-text { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 20px; line-height: 1.4; }
        
        .opt-btn { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 2px solid #eee; background: white; text-align: left; font-size: 0.95rem; }
        .opt-btn.selected { background: #ff9800; color: white; border-color: #ff9800; }

        /* Navigation Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; display: flex; justify-content: space-between; border-top: 2px solid #ddd; }
        .btn-nav { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.9rem; color: white; }

        /* Score Display */
        .score-big { font-size: 4rem; color: #ff9800; font-weight: 800; margin: 10px 0; }
        .yt-btn { display: block; width: 100%; background: #ff0000; color: white; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px; }

        /* Question Themes */
        .theme-0 { background: #FDE2E4; } .theme-1 { background: #E2ECE9; } .theme-2 { background: #FFF1E6; } .theme-3 { background: #DFE7FD; }
    </style>
</head>
<body class="theme-0">

<div id="welcome-screen" class="screen">
    <div class="card">
        <h1 style="color: #1e3c72; font-size: 1.8rem;">Polai Academy</h1>
        <h3 style="color: #666; margin-bottom: 15px;">SSC-GD Mock Test 2026</h3>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 15px; margin: 15px 0; text-align: left; font-size: 0.9rem;">
            <p>📝 Questions: 80 </p>
            <p>⏱️ Time: 60 Minutes</p>
            <p>⭐ Marking: +2 / -1</p>
        </div>
        <button onclick="startTest()" style="width: 100%; padding: 15px; background: #ff9800; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1.1rem;">Start Test</button>
    </div>
</div>

<div id="test-screen" class="screen" style="display:none; justify-content: flex-start; padding-top: 10px;">
    <div class="top-bar">
        <span id="q-indicator" style="font-weight: bold;">Question 1/80</span>
        <div class="timer-badge" id="timer">60:00</div>
    </div>
    
    <div class="palette-mobile" id="palette"></div>

    <div class="card q-area">
        <span class="q-tag" id="q-section">Reasoning</span>
        <div class="q-text" id="q-text">Loading...</div>
        <div id="options-container"></div>
    </div>

    <div class="nav-bar">
        <button onclick="prevQ()" id="prev-btn" class="btn-nav" style="background: #95a5a6;">Prev</button>
        <button onclick="nextQ()" id="next-btn" class="btn-nav" style="background: #1e3c72;">Save & Next</button>
        <button onclick="finishTest()" id="finish-btn" class="btn-nav" style="background: #27ae60; display:none;">Finish</button>
    </div>
</div>

<div id="result-screen" class="screen" style="display:none;">
    <div class="card" style="text-align: center;">
        <h2 style="color: #2c3e50;">Test Summary</h2>
        <div class="score-big" id="final-score">0</div>
        <p>Correct: <span id="res-c" style="color:#27ae60; font-weight:bold;">0</span> | Wrong: <span id="res-w" style="color:#e74c3c; font-weight:bold;">0</span></p>
        <h3 style="margin-top: 10px;">Best of Luck! 🏆</h3>
        
        <a href="https://youtube.com/@polaiacademy?si=gUwt0zAa-S8ccqhK" target="_blank" class="yt-btn">
            <i class="fab fa-youtube"></i> Subscribe Polai Academy
        </a>
        <button onclick="location.reload()" style="background:none; border:none; color:#666; margin-top:20px; font-weight:bold;">Restart Test</button>
    </div>
</div>

<script>
    // Full Question Bank (80 Questions)
    const questions = [
        // Reasoning 1-20
        { s: "Reasoning", q: "Series: LOK, NMI, PKG, RIE, ?", opts: ["UHC", "TGC", "SGD", "SHC"], ans: 1 },
        { s: "Reasoning", q: "Relation: Car, Table, Maruti", opts: ["Option A", "Option B", "Option C", "Option D"], ans: 1 },
        { s: "Reasoning", q: "Mamta says: Photo woman is wife of son of only daughter of my father's wife. Relation?", opts: ["Aunt", "Sister", "Mother", "Mother-in-law"], ans: 3 },
        { s: "Reasoning", q: "If INDIAN = 799271, then what is 451371119?", opts: ["EHMNSV", "EHNMSV", "EHNSMV", "EHNMVS"], ans: 1 },
        { s: "Reasoning", q: "Circular Table: A sits 4th right of F. H sits immediate left of F. G sits immediate right of C.", opts: ["I & IV Correct", "II & III Correct", "I & II Correct", "II & IV Correct"], ans: 2 },
        { s: "Reasoning", q: "Paper Folding: Identify the unfolded pattern.", opts: ["Figure A", "Figure B", "Figure C", "Figure D"], ans: 2 },
        { s: "Reasoning", q: "Analogy: 350:7 :: 68:? :: 222:6", opts: ["3", "5", "2", "4"], ans: 3 },
        { s: "Reasoning", q: "Math Equation: 17 * 4 * 63 * 7 * 21 * 3 * 59", opts: ["x, +, /, -, +, =", "=, -, x, +, -, /", "., x, +, =, /,", "=, -, x, /, -"], ans: 0 },
        { s: "Reasoning", q: "Syllogism: Some colonies are villages. Some villages are cities.", opts: ["Only II follows", "I, II, III follow", "Only I follows", "Either I or III follows"], ans: 3 },
        { s: "Reasoning", q: "Series: 18, 27, 34, 39, 42, ?", opts: ["45", "44", "42", "43"], ans: 3 },
        { s: "Reasoning", q: "Flags: Each child gets 1/6 of total. If children 1/3, each gets 3. Total children?", opts: ["9", "6", "12", "8"], ans: 2 },
        { s: "Reasoning", q: "Select similar: Jute : Cotton :: Wool : ?", opts: ["Terylene", "Silk", "Rayon", "Nylon"], ans: 1 },
        { s: "Reasoning", q: "Dictionary: 1. Fragile 2. Fracture 3. Fraud 4. Fragment 5. Fridge", opts: ["2, 1, 4, 3, 5", "1, 2, 5, 3, 4", "1, 2, 4, 3, 5", "2, 1, 4, 5, 3"], ans: 2 },
        { s: "Reasoning", q: "Line: M between L and S. N right of S. R left of L. Who is middle?", opts: ["L", "S", "M", "R"], ans: 2 },
        { s: "Reasoning", q: "Code: ASCRIBE = 1-3-19-18-2-5-9. SPECIES = ?", opts: ["16-5-19-3-5-18-19", "15-6-19-3-9-5-19", "5-16-19-6-5-9-19", "5-16-19-3-5-9-19"], ans: 3 },
        { s: "Reasoning", q: "Cube Folding: Opposite of 'a'?", opts: ["F", "G", "E", "H"], ans: 3 },
        { s: "Reasoning", q: "Number Series: 23, 28, 280, 295, 5900, ?", opts: ["5920", "5935", "5925", "5930"], ans: 2 },
        { s: "Reasoning", q: "Letter Series: _bca_cca_ca_b_c", opts: ["bbabb", "aabaa", "bbbab", "aaaaa"], ans: 2 },
        { s: "Reasoning", q: "Sports Venn: 50 football, 40 cricket, 30 basketball. Football OR Cricket NOT Basketball?", opts: ["56", "50", "34", "22"], ans: 1 },
        { s: "Reasoning", q: "Pattern: Select figure completing the question mark (?)", opts: ["Figure 1", "Figure 2", "Figure 3", "Figure 4"], ans: 3 },

        // GA 21-40 
        { s: "General Awareness", q: "Dumhal dance is performed by which Kashmir tribe?", opts: ["Wattal", "Purigpa", "Gaddi", "Bakarwal"], ans: 0 },
        { s: "General Awareness", q: "Unique feature of Dholavira (Indus Valley)?", opts: ["3 parts division", "Uneven division", "Horizontal division", "None"], ans: 0 },
        { s: "General Awareness", q: "'Kesar-e-Hind' butterfly related to which state?", opts: ["Sikkim", "West Bengal", "Arunachal Pradesh", "Odisha"], ans: 2 },
        { s: "General Awareness", q: "Calculation including current prices in economic production?", opts: ["Ordinal GDP", "Interval GDP", "Nominal GDP", "Real GDP"], ans: 2 },
        { s: "General Awareness", q: "Who is the Solicitor General of India?", opts: ["Sudip Jain", "Tushar Mehta", "Adarsh Goyal", "Kuldeep Singh"], ans: 1 },
        { s: "General Awareness", q: "Which is NOT a Kharif crop?", opts: ["Wheat", "Groundnut", "Paddy", "Maize"], ans: 0 },
        { s: "General Awareness", q: "Article for 'Equal Protection of Law'?", opts: ["Art 12", "Art 13", "Art 14", "Art 15"], ans: 2 },
        { s: "General Awareness", q: "Auxin function?", opts: ["Apical dominance", "Cell division", "Fruit ripening", "Internodal elongation"], ans: 0 },
        { s: "General Awareness", q: "Earliest evidence of agriculture in Subcontinent?", opts: ["Pratapgarh", "Quetta", "Mehrgarh", "Kalat"], ans: 2 },
        { s: "General Awareness", q: "Sedimentation property used?", opts: ["Light/Soluble", "Light/Insoluble", "Heavy/Soluble", "Heavy/Insoluble"], ans: 3 },
        { s: "General Awareness", q: "Minimum weight of body?", opts: ["Equator", "Tropics", "Subtropics", "Poles"], ans: 0 },
        { s: "General Awareness", q: "Who translated Baburnama to Persian?", opts: ["Humayun", "Khawaja Atash", "Abul Fazal", "Abdul Rahim Khan-I-Khana"], ans: 3 },
        { s: "General Awareness", q: "KVIC established in which 5-year plan?", opts: ["3rd", "4th", "2nd", "1st"], ans: 2 },
        { s: "General Awareness", q: "Subhas Chandra Bose resigned as Congress President in?", opts: ["1938", "1939", "1940", "1937"], ans: 1 },
        { s: "General Awareness", q: "Book NOT written by Dr. A.P.J. Abdul Kalam?", opts: ["Response in Living", "Target 3 Billion", "Luminous Sparks", "Advantage India"], ans: 0 },
        { s: "General Awareness", q: "NABARD recommendation?", opts: ["Gadgil", "Rangarajan", "Sivaraman", "Dhantwala"], ans: 2 },
        { s: "General Awareness", q: "Universal Donor Blood Group?", opts: ["O", "A", "B", "AB"], ans: 0 },
        { s: "General Awareness", q: "Prime Minister of UK (2023)?", opts: ["Theresa May", "David Cameron", "Clement Attlee", "Rishi Sunak"], ans: 3 },
        { s: "General Awareness", q: "Gupta ruler who repulsed Huna invasion?", opts: ["Samudragupta", "Chandragupta II", "Skandagupta", "Kumaragupta"], ans: 2 },
        { s: "General Awareness", q: "'Isai Kudil Scheme' state?", opts: ["Lakshadweep", "Assam", "Puducherry", "Mizoram"], ans: 2 },

        // Math 41-60 
        { s: "Quant", q: "12% of A = 10% of B. 24% of A = ?", opts: ["20% of B", "15% of B", "18% of B", "16% of B"], ans: 0 },
        { s: "Quant", q: "Kapil sells 20 mangoes for 50k, profit = CP of 5. CP of 1?", opts: ["1k", "2k", "2.5k", "3k"], ans: 1 },
        { s: "Quant", q: "Wallet loss 25%. If 140 more, gain 10%. CP?", opts: ["400", "500", "300", "600"], ans: 0 },
        { s: "Quant", q: "Article sold for 535.50 after 25% & 15% discounts. Marked Price?", opts: ["840", "820", "800", "830"], ans: 0 },
        { s: "Quant", q: "Ratio of Quant (38%) students to others?", opts: ["19:31", "17:19", "23:27", "27:31"], ans: 0 },
        { s: "Quant", q: "Sum amounts 672 in 2yrs, 762 in 4.5yrs (SI). Sum?", opts: ["600", "450", "560", "670"], ans: 0 },
        { s: "Quant", q: "Sampita needs 40%. Gets 150 marks, fails by 50. Max?", opts: ["400", "300", "200", "500"], ans: 3 },
        { s: "Quant", q: "Purchase 2000, Sell 2100. Profit %?", opts: ["2%", "3%", "5%", "4%"], ans: 2 },
        { s: "Quant", q: "755x3678y divisible by 45. Max x+y?", opts: ["12", "11", "13", "14"], ans: 2 },
        { s: "Quant", q: "21 pages/day for 30 days. If 18 pages/day, days taken?", opts: ["32", "40", "34", "35"], ans: 3 },
        { s: "Quant", q: "SI: 5 yrs @ 8% = 3960. Same sum @ 12% for 6.66 yrs?", opts: ["6600", "5280", "7920", "8000"], ans: 2 },
        { s: "Quant", q: "Rajeev in 15 yrs = 5 times age 5 yrs ago. Present?", opts: ["9", "10", "7", "5"], ans: 1 },
        { s: "Quant", q: "Simplify: 65 - [40 - (60/5 - (18-24/4)/6)]", opts: ["40", "35", "30", "37"], ans: 1 },
        { s: "Quant", q: "12km upstream in 3hrs. Stream 1km/hr. Downstream speed?", opts: ["7", "6", "5", "8"], ans: 1 },
        { s: "Quant", q: "Rajesh & Arun in 24 days. Rajesh 3x efficient. Rajesh alone?", opts: ["32", "22", "36", "12"], ans: 0 },
        { s: "Quant", q: "Wheel 77cm. Revolutions for 121 km?", opts: ["24200", "10000", "50000", "42500"], ans: 2 },
        { s: "Quant", q: "Walk 15 instead 10, walk 40km more. Actual distance?", opts: ["70", "80", "50", "60"], ans: 1 },
        { s: "Quant", q: "A, B, C in x, 30, 45. B+C work 6 days. A finish in 12 days. x?", opts: ["24", "20", "18", "15"], ans: 2 },
        { s: "Quant", q: "Avg: 16 (55), 25 (45), 14 (40). Total avg?", opts: ["40.5", "46.5", "44.5", "None"], ans: 3 },
        { s: "Quant", q: "Ram + Sam = Sam + Tom + 12. Tom younger than Ram by?", opts: ["6", "10", "12", "15"], ans: 2 },

        // English 61-80 
        { s: "English", q: "Fill: He must ____ his career with seriousness.", opts: ["pursue", "direct", "complete", "follow"], ans: 0 },
        { s: "English", q: "Idiom: Haul over the coals", opts: ["Scold", "Barter", "Pretend", "Prevail"], ans: 0 },
        { s: "English", q: "Substitution: Ban on alcohol ... 'before' a thorough study.", opts: ["No improvement", "with", "after", "in"], ans: 2 },
        { s: "English", q: "Conjunction: ____ late, he is a skilled worker.", opts: ["But", "Though", "Since", "Unless"], ans: 1 },
        { s: "English", q: "Preposition: Distinguish ____ black and blue.", opts: ["between", "among", "in", "from"], ans: 0 },
        { s: "English", q: "One Word: All people entitled to vote.", opts: ["Electorate", "Predilection", "Defection", "Conjectural"], ans: 0 },
        { s: "English", q: "Portrayal of public ____ in cinema.", opts: ["commonality", "uniformity", "candour", "personas"], ans: 3 },
        { s: "English", q: "Error: This is hers dress.", opts: ["This", "is", "hers", "dress"], ans: 2 },
        { s: "English", q: "Error: Candidate along with supporters leave the building.", opts: ["The", "along with", "her", "leave"], ans: 3 },
        { s: "English", q: "Idiom: Dog has his day", opts: ["treated well", "faithful", "good luck at a point", "man's best friend"], ans: 2 },
        { s: "English", q: "Antonym: Feeble", opts: ["Weak", "Strong", "Infirm", "Languid"], ans: 1 },
        { s: "English", q: "One Word: Does not express freely.", opts: ["Introvert", "Extrovert", "Silent", "Stupid"], ans: 1 },
        { s: "English", q: "Synonym: Robust", opts: ["Robust", "Vigorous", "Infirm", "Frail"], ans: 1 },
        { s: "English", q: "Misspelt word:", opts: ["Exclusionary", "Confidance", "Tragedy", "Pedagogical"], ans: 1 },
        { s: "English", q: "Antonym: Artificial (News is genuine)", opts: ["Pure", "Actual", "Artificial", "Sincere"], ans: 2 },
        { s: "Comprehension", q: "Reaction of parents to squirrel incident?", opts: ["Worried", "Anxious", "Upset", "Angry"], ans: 3 },
        { s: "Comprehension", q: "Who did they take help from?", opts: ["Casper", "Marshal", "Martin", "Cooper"], ans: 3 },
        { s: "Comprehension", q: "Robert's reaction to fox?", opts: ["Fainted", "Ducked", "Fought", "Ran away"], ans: 3 },
        { s: "Comprehension", q: "Similar to 'web'?", opts: ["Packet", "Rope", "Trap", "Ditch"], ans: 2 },
        { s: "Comprehension", q: "Synonym of 'lurking'?", opts: ["Walk", "Jump", "Attack", "Sneak"], ans: 3 }
    ];

    let curr = 0;
    let answers = new Array(questions.length).fill(null);
    let timeLeft = 60 * 60;
    let timerId;

    function startTest() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('test-screen').style.display = 'flex';
        renderPalette();
        updateQ();
        timerId = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if (timeLeft <= 0) finishTest();
        }, 1000);
    }

    function renderPalette() {
        const pal = document.getElementById('palette');
        pal.innerHTML = '';
        questions.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = `p-dot ${answers[i] !== null ? 'done' : ''} ${i === curr ? 'active' : ''}`;
            d.innerText = i + 1;
            pal.appendChild(d);
        });
    }

    function updateQ() {
        const q = questions[curr];
        document.body.className = `theme-${curr % 4}`;
        document.getElementById('q-indicator').innerText = `Question ${curr + 1}/${questions.length}`;
        document.getElementById('q-section').innerText = q.s;
        document.getElementById('q-text').innerText = q.q;
        
        const opts = document.getElementById('options-container');
        opts.innerHTML = '';
        q.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = `opt-btn ${answers[curr] === i ? 'selected' : ''}`;
            b.innerText = `${String.fromCharCode(65 + i)}. ${o}`;
            b.onclick = () => { answers[curr] = i; updateQ(); };
            opts.appendChild(b);
        });

        document.getElementById('prev-btn').style.visibility = curr === 0 ? 'hidden' : 'visible';
        document.getElementById('next-btn').style.display = curr === questions.length - 1 ? 'none' : 'block';
        document.getElementById('finish-btn').style.display = curr === questions.length - 1 ? 'block' : 'none';
        renderPalette();
    }

    function nextQ() { if (curr < questions.length - 1) { curr++; updateQ(); } }
    function prevQ() { if (curr > 0) { curr--; updateQ(); } }

    function finishTest() {
        clearInterval(timerId);
        document.getElementById('test-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        document.body.className = 'theme-0';

        let c = 0, w = 0;
        answers.forEach((a, i) => {
            if (a !== null) {
                if (a === questions[i].ans) c++;
                else w++;
            }
        });
        document.getElementById('final-score').innerText = (c * 2) - w;
        document.getElementById('res-c').innerText = c;
        document.getElementById('res-w').innerText = w;
    }
</script>
</body>
</html>
